        finalAmountOriginal:
          $ref: '#/components/schemas/PositiveOriginalAmount'
        externalRef: { type: string, maxLength: 128 }
        note: { type: string, minLength: 1, maxLength: 500, description: 판단 근거(audit 기록) }
      if:
        properties: { outcome: { const: CHARGED } }
      then:
        required: [finalAmountOriginal]
        properties:
          finalAmountOriginal: { $ref: '#/components/schemas/PositiveOriginalAmount' }
    ReservationAdjustRequest:
      type: object
      description: |
        basis=ORIGINAL이면 예약 통화 금액(최대 소수 12자리)이며 recognized_cost_original도 변한다.
        basis=KRW이면 최대 소수 6자리다. 외화 예약의 recognizedCostOriginal은 유지되고 KRW 예약의 원본 인식 비용은 KRW 비용과 함께 변한다(ADR-057).
        두 기준 모두 원장 original_amount의 DECIMAL(24,12) 범위에 따라 정수부는 최대 12자리다.
        ADJUSTMENT는 부호 있는 증감, REFUND는 양수(환불액). 인식 비용이 음수가 되면 POLICY_VIOLATION.
      required: [entryType, basis, amount, reasonCode, note]
      additionalProperties: false
      properties:
        entryType: { type: string, enum: [ADJUSTMENT, REFUND] }
        basis: { type: string, enum: [ORIGINAL, KRW] }
        amount: { $ref: '#/components/schemas/OriginalAmount' }
        reasonCode: { type: string, pattern: '^[A-Z_]{2,32}$', examples: [FX_DIFFERENCE, PROVIDER_INVOICE, MANUAL_CORRECTION] }
        externalRef: { type: string, maxLength: 128 }
        note: { type: string, minLength: 1, maxLength: 500 }
      if:
        properties:
          basis: { const: KRW }
      then:
        properties:
          amount:
            type: string
            pattern: '^-?(0|[1-9][0-9]{0,11})(\.[0-9]{1,6})?$'

