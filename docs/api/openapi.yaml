          $ref: "#/components/schemas/Id"
        revisionNo:
          type: "integer"
          minimum: 1
        workingTitle:
          type: "string"
          minLength: 1
          maxLength: 255
        brief:
          type: "string"
          minLength: 1
          maxLength: 4000
        language:
          type: "string"
          minLength: 1
          maxLength: 16
        targetDurationSeconds:
          type: "integer"
          minimum: 1
          maximum: 14400
        settings:
          type: "object"
          additionalProperties: true
        baseRunId:
          type: ["string","null"]
          pattern: "^[1-9][0-9]{0,18}$"
        revisionHash:
          type: "string"
          pattern: "^[0-9a-f]{64}$"
        createdAt:
          type: "string"
          format: "date-time"
      required: ["id","contentId","revisionNo","workingTitle","brief","language","targetDurationSeconds","settings","baseRunId","revisionHash","createdAt"]
    ContentRevisionCreateRequest:
      type: "object"
      additionalProperties: false
      properties:
        baseRevisionNo:
          type: "integer"
          minimum: 1
        workingTitle:
          type: "string"
          minLength: 1
          maxLength: 255
          description: "서버 정규화 후 Unicode 코드포인트 기준 길이를 검사한다. 짝 없는 surrogate는 400 VALIDATION_FAILED다."
        brief:
          type: "string"
          minLength: 1
          maxLength: 4000
          description: "서버 정규화 후 Unicode 코드포인트 기준 길이를 검사한다. 짝 없는 surrogate는 400 VALIDATION_FAILED다."
        language:
          type: "string"
          minLength: 1
          maxLength: 16
          pattern: "^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$"
        targetDurationSeconds:
          type: "integer"
          minimum: 1
          maximum: 14400
          description: "콘텐츠 유형별 채널 설정의 최소·최대 영상 길이를 적용한다."
        settings:
          type: ["object","null"]
          additionalProperties: true
          description: "생략하거나 null이면 빈 설정이다. 객체 내 중첩 배열·객체는 허용한다. 숫자는 정수만 허용하며 canonical JSON의 UTF-8 인코딩이 16 KiB 이하여야 한다. 키 및 값에 짝 없는 surrogate가 있으면 400 VALIDATION_FAILED다."
        baseRunId:
          type: ["string","null"]
          pattern: "^[1-9][0-9]{0,18}$"
          description: "지정 시 같은 콘텐츠의 SUCCEEDED Run만 허용한다. 조건 불충족 시 400 VALIDATION_FAILED다."
        changeReason:
          type: ["string","null"]
          minLength: 1
          maxLength: 500
      required: ["baseRevisionNo","workingTitle","brief","language","targetDurationSeconds"]
    ContentRevisionPage:
