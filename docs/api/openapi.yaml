  /api/v1/budget-reservations/{reservationId}/resolve:
    parameters:
      - $ref: '#/components/parameters/ReservationId'
    post:
      tags: [budget-reservations]
      operationId: resolveBudgetReservation
      summary: 과금 불명·미정산 예약의 관리자 확정(CONFIRM 또는 RELEASE)
      description: |
        CHARGED → CONFIRM(finalAmountOriginal 필수, 예약 통화 총액), NOT_CHARGED → RELEASE(인식 비용이 0이어야 함).
        RELEASED 예약의 CHARGED는 지연 과금(ADR-048)으로 externalRef(근거)와 note(사유)가 필수다.
        허용되지 않은 상태는 INVALID_STATE_TRANSITION. 예약은 API로 생성하지 않는다(내부 서비스, T03~T04).
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationResolveRequest' }
      responses:
        '200':
          description: 처리 결과(멱등 재요청이면 기존 결과)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

