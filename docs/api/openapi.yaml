openapi: 3.1.0
info:
  title: AI Studio Admin API
  version: 0.3.0
  summary: T02 관리자 API 계약 (설계 기준선, ADR-026~061)
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    계약 우선 개발 기준 문서(ADR-021, ADR-032). 구현 전 설계 검토 대상이다.
    - 모든 시각은 UTC ISO 8601(`date-time`). 화면은 사용자/채널 시간대로 변환한다.
    - BIGINT ID, 금액, 환율은 **문자열**로 주고받는다(ADR-030, ADR-032).
      KRW 금액은 소수 최대 6자리, 원본 통화 금액은 최대 12자리, 환율은 최대 10자리. 초과 자릿수는 VALIDATION_FAILED.
    - 목록은 `page`(0부터)·`size`(기본 20, 최대 100).
    - 오류는 `ErrorResponse`(19개 고정 코드, ADR-011/012). 응답 헤더 `X-Trace-Id`와 본문 traceId가 같다.
    - 인증: 세션 쿠키 `AI_STUDIO_SESSION` + 상태 변경 요청은 `X-XSRF-TOKEN` 헤더(ADR-037, ADR-044). 토큰은 `GET /api/v1/auth/csrf`로 받고
      로그인·로그아웃 후 다시 받는다.
    - 관리자 정산 조치는 `Idempotency-Key` 헤더가 원장 event_key가 된다. 같은 키·같은 내용은 같은 결과, 다른 내용은 409.
servers:
  - url: http://127.0.0.1:8080
    description: local
security:
  - sessionCookie: []
tags:
  - name: auth
    description: 세션 인증·CSRF
  - name: dashboard
    description: 관리자 대시보드
  - name: channels
    description: 채널 등록·상태
  - name: channel-config
    description: 채널 설정 불변 revision
  - name: budget-policies
    description: 예산 정책과 변경 이력
  - name: budget-usage
    description: 예산 사용량·정합성
  - name: budget-reservations
    description: 예산 예약 조회·관리자 정산 조치
  - name: cost-ledger
    description: append-only 비용 원장
  - name: exchange-rates
    description: 수동 환율

  - name: topics
    description: 불변 Topic
  - name: contents
    description: 콘텐츠 및 불변 Revision

  - name: Production
    description: V2 제작 요청
paths:
  /api/v1/auth/csrf:
    get:
      tags: [auth]
      operationId: getCsrfToken
      summary: CSRF 토큰 발급(비인증)
      security: []
      responses:
        '200':
          description: 현재 세션의 CSRF 토큰
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CsrfToken' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: 관리자 로그인(비인증, CSRF 필수)
      description: 성공 시 세션 ID가 교체된다. 실패 사유(미존재·비밀번호 오류·비활성)는 구분하지 않는다.
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 로그아웃(세션 폐기)
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204': { description: 로그아웃됨 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: 현재 로그인 사용자
      responses:
        '200':
          description: 현재 사용자
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/dashboard/summary:
    get:
      tags: [dashboard]
      operationId: getDashboardSummary
      summary: 기본 대시보드 요약
      responses:
        '200':
          description: 기본 대시보드
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/channels:
    get:
      tags: [channels]
      operationId: listChannels
      summary: 채널 목록
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ChannelStatus' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 채널 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [channels]
      operationId: createChannel
      summary: 채널 등록(설정 revision 1 동시 생성)
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChannelCreateRequest' }
      responses:
        '201':
          description: 생성됨
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/channels/{channelId}:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      tags: [channels]
      operationId: getChannel
      summary: 채널 조회
      responses:
        '200':
          description: 채널
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [channels]
      operationId: updateChannel
      summary: 채널 기본 정보 수정(optimistic lock)
      description: ARCHIVED 채널은 수정 불가(INVALID_STATE_TRANSITION). version 불일치는 RESOURCE_CONFLICT.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChannelUpdateRequest' }
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/channels/{channelId}/pause:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    post:
      tags: [channels]
      operationId: pauseChannel
      summary: ACTIVE → PAUSED
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionRequest' }
      responses:
        '200': { $ref: '#/components/responses/ChannelResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/channels/{channelId}/resume:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    post:
      tags: [channels]
      operationId: resumeChannel
      summary: PAUSED → ACTIVE
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionRequest' }
      responses:
        '200': { $ref: '#/components/responses/ChannelResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/channels/{channelId}/archive:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    post:
      tags: [channels]
      operationId: archiveChannel
      summary: ACTIVE·PAUSED → ARCHIVED(물리 삭제 없음, 비용·성과 보존)
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionRequest' }
      responses:
        '200': { $ref: '#/components/responses/ChannelResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        "409":
          description: "활성 Run 포인터 또는 실제 비종료 Run이 있으면 INVALID_STATE_TRANSITION이다. 기존 상태 및 version 충돌도 409다."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/channels/{channelId}/config:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      tags: [channel-config]
      operationId: getCurrentChannelConfig
      summary: 현재 채널 설정
      responses:
        '200':
          description: 현재(최신) 설정 revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/channels/{channelId}/config/revisions:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      tags: [channel-config]
      operationId: listChannelConfigRevisions
      summary: 채널 설정 이력(최신순)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 설정 이력
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelConfigPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [channel-config]
      operationId: createChannelConfigRevision
      summary: 새 설정 revision 생성(기존 revision 불변)
      description: baseRevisionNo가 현재 최신이 아니면 RESOURCE_CONFLICT. ARCHIVED 채널은 INVALID_STATE_TRANSITION.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChannelConfigCreateRequest' }
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelConfig' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/channels/{channelId}/config/revisions/{revisionNo}:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
      - name: revisionNo
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [channel-config]
      operationId: getChannelConfigRevision
      summary: 채널 설정 revision 조회
      responses:
        '200':
          description: 설정 revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/budget-policies:
    get:
      tags: [budget-policies]
      operationId: listBudgetPolicies
      summary: 예산 정책 목록
      parameters:
        - name: scope
          in: query
          schema: { $ref: '#/components/schemas/BudgetScope' }
        - name: channelId
          in: query
          schema: { $ref: '#/components/schemas/Id' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/BudgetPolicyStatus' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 정책 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetPolicyPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [budget-policies]
      operationId: createBudgetPolicy
      summary: 예산 정책 생성(revision 1 포함)
      description: 같은 scope·대상·기간 유형 정책이 있으면 DUPLICATE_RESOURCE. CONTENT scope는 T03 전까지 불가.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BudgetPolicyCreateRequest' }
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetPolicy' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/budget-policies/{policyId}:
    parameters:
      - $ref: '#/components/parameters/PolicyId'
    get:
      tags: [budget-policies]
      operationId: getBudgetPolicy
      summary: 예산 정책 조회
      responses:
        '200':
          description: 정책
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetPolicy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/budget-policies/{policyId}/revisions:
    parameters:
      - $ref: '#/components/parameters/PolicyId'
    get:
      tags: [budget-policies]
      operationId: listBudgetPolicyRevisions
      summary: 정책 변경 이력(최신순)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: revision 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetPolicyRevisionPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [budget-policies]
      operationId: createBudgetPolicyRevision
      summary: 한도·시간대 변경(새 revision)
      description: 한도는 현재 기간부터 즉시, 시간대는 다음 기간부터 적용(ADR-038). baseRevisionNo 불일치는 RESOURCE_CONFLICT.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BudgetPolicyRevisionCreateRequest' }
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetPolicy' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/budget-policies/{policyId}/enable:
    parameters:
      - $ref: '#/components/parameters/PolicyId'
    post:
      tags: [budget-policies]
      operationId: enableBudgetPolicy
      summary: 정책 활성화
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionRequest' }
      responses:
        '200': { $ref: '#/components/responses/BudgetPolicyResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/budget-policies/{policyId}/disable:
    parameters:
      - $ref: '#/components/parameters/PolicyId'
    post:
      tags: [budget-policies]
      operationId: disableBudgetPolicy
      summary: 신규 예약에서 제외(기존 bucket·정산 유지)
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionRequest' }
      responses:
        '200': { $ref: '#/components/responses/BudgetPolicyResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/budget-policies/{policyId}/buckets:
    parameters:
      - $ref: '#/components/parameters/PolicyId'
    get:
      tags: [budget-usage]
      operationId: listBudgetBuckets
      summary: 정책의 기간별 사용량 이력(최신순)
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: bucket 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetBucketPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/budget/usage:
    get:
      tags: [budget-usage]
      operationId: getBudgetUsage
      summary: 현재 기간 예산 사용량
      description: channelId가 없으면 SYSTEM 정책, 있으면 SYSTEM과 해당 채널 정책의 현재 bucket. bucket이 아직 없으면 0으로 계산한 가상 값.
      parameters:
        - name: channelId
          in: query
          schema: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: 사용량
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetUsage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/budget/consistency-checks:
    post:
      tags: [budget-usage]
      operationId: runBudgetConsistencyCheck
      summary: 원장·예약·bucket 정합성 검사 실행(자동 수정 없음)
      description: 결과를 budget_control에 기록한다. ERROR면 신규 예약이 차단되고 다음 OK 검사에서 해제된다(ADR-054).
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200':
          description: 검사 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsistencyReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/budget/control:
    get:
      tags: [budget-usage]
      operationId: getBudgetControl
      summary: 지출 허용 여부와 최근 정합성 검사 상태
      responses:
        '200':
          description: 전역 예산 제어 상태
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetControl' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/budget/control/spending:
    post:
      tags: [budget-usage]
      operationId: setSpendingEnabled
      summary: 지출 허용/긴급 차단(ADR-061)
      description: 기본은 차단(false). 차단 중에도 기존 예약 정산·조회·관리자 확정은 허용. version 불일치는 RESOURCE_CONFLICT.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
