          $ref: "#/components/responses/Forbidden"
        "404":
          description: "콘텐츠가 없거나 요청한 revisionNo가 해당 콘텐츠에 없다."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
      parameters: [{"name":"contentId","in":"path","required":true,"schema":{"$ref":"#/components/schemas/Id"}},{"name":"revisionNo","in":"path","required":true,"schema":{"type":"integer","minimum":1}}]
      tags: ["contents"]

  /api/v1/production-requests:
    post:
      operationId: createProductionRequest
      summary: 소재 선정 전 제작 요청 생성
      tags: [Production]
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ContentCommandKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelId, contentType]
              properties:
                channelId: { $ref: '#/components/schemas/Id' }
                contentType: { type: string, enum: [SHORTS, LONGFORM] }
                selectionMode: { type: string, enum: [AUTO, MANUAL], default: AUTO, description: 'SHORTS 소재 설정' }
                candidateCount: { type: integer, minimum: 5, maximum: 10, default: 8, description: 'SHORTS 소재 후보 수' }
      responses:
        '200':
          description: 기존 요청 재생
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionRequestSummary' }
        '201':
          description: 요청 및 초기 단계 생성
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionRequestSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/production-requests/{id}:
    parameters:
      - $ref: '#/components/parameters/ProductionRequestId'
    get:
      operationId: getProductionRequest
      summary: 제작 요청과 단계 및 비용 상태 조회
      tags: [Production]
      responses:
        '200': { $ref: '#/components/responses/ProductionRequestDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/production-requests/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/ProductionRequestId'
    post:
      operationId: cancelProductionRequest
      summary: 취소 의도 기록 및 현재 상태 반환
      tags: [Production]
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200': { $ref: '#/components/responses/ProductionRequestDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/production-requests/{id}/discovery:
    parameters:
      - $ref: '#/components/parameters/ProductionRequestId'
    get:
      operationId: getProductionDiscovery
      summary: 소재 후보와 평가 및 선정 결과 조회
      tags: [Production]
      responses:
        '200': { $ref: '#/components/responses/ProductionDiscoveryDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/production-requests/{id}/selection:
    parameters:
      - $ref: '#/components/parameters/ProductionRequestId'
    post:
      operationId: chooseProductionCandidate
      summary: 수동 소재 선택 의도 저장
      tags: [Production]
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidateId, version]
              properties:
                candidateId: { type: integer, minimum: 1, maximum: 10 }
                version: { type: integer, minimum: 0 }
      responses:
        '200': { $ref: '#/components/responses/ProductionDiscoveryDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: AI_STUDIO_SESSION
      description: HttpOnly, SameSite=Lax, Path=/, 유휴 30분, Secure(prod만) (ADR-044)
    csrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: 상태 변경 요청(POST/PATCH)에 필수. GET /api/v1/auth/csrf로 발급.

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ChannelId:
      name: channelId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    PolicyId:
      name: policyId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    ReservationId:
      name: reservationId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 원장 event_key로 사용. 같은 키·같은 내용은 같은 결과, 다른 내용은 409 RESOURCE_CONFLICT.
      schema: { $ref: '#/components/schemas/IdempotencyKey' }

    ProductionRequestId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }

    ContentCommandKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Topic 또는 콘텐츠 생성 명령의 영속 재생 키.
      schema: { $ref: '#/components/schemas/IdempotencyKey' }

  responses:
    ProductionDiscoveryDetail:
      description: 현재 소재 발굴 및 선정 상태
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProductionDiscoveryDetail' }
    ProductionRequestDetail:
      description: 제작 요청의 현재 상세 상태
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProductionRequestDetail' }
    BadRequest:
      description: INVALID_REQUEST, VALIDATION_FAILED, PAYLOAD_TOO_LARGE 등 입력 오류
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: UNAUTHORIZED
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: FORBIDDEN(권한 없음, CSRF 실패)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: RESOURCE_NOT_FOUND
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: RESOURCE_CONFLICT, INVALID_STATE_TRANSITION, PREREQUISITE_NOT_MET, DUPLICATE_RESOURCE
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unprocessable:
      description: POLICY_VIOLATION, BUDGET_EXCEEDED
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequests:
      description: RATE_LIMIT_EXCEEDED
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError:
      description: INTERNAL_SERVER_ERROR
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ChannelResult:
      description: 변경된 채널
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Channel' }
    BudgetPolicyResult:
      description: 변경된 정책
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BudgetPolicy' }

  schemas:
    ProductionStatus:
      type: string
      enum: [QUEUED, RUNNING, RECOVERY_REQUIRED, SUCCEEDED, FAILED, CANCELLED]
    ProductionDiscoveryDetail:
      type: object
      required: [selectionMode, candidateCount, version, awaitingSelection, candidates]
      properties:
        selectionMode: { type: string, enum: [AUTO, MANUAL] }
        candidateCount: { type: integer, minimum: 5, maximum: 10 }
        version: { type: integer, minimum: 0 }
        awaitingSelection: { type: boolean }
        chosenCandidateId: { type: [integer, 'null'], minimum: 1, maximum: 10 }
        selectedCandidateId: { type: [integer, 'null'], minimum: 1, maximum: 10 }
        selectionReason: { type: [string, 'null'] }
        candidates:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/EvaluatedDiscoveryCandidate' }
    DiscoveryScores:
      type: object
      required: [interest, channelFit, originality, visualPotential, evidencePotential, costEfficiency]
      properties:
        interest: { type: integer, minimum: 0, maximum: 25 }
        channelFit: { type: integer, minimum: 0, maximum: 20 }
        originality: { type: integer, minimum: 0, maximum: 20 }
        visualPotential: { type: integer, minimum: 0, maximum: 15 }
        evidencePotential: { type: integer, minimum: 0, maximum: 15 }
        costEfficiency: { type: integer, minimum: 0, maximum: 5 }
    EvaluatedDiscoveryCandidate:
      type: object
      required: [candidateId, candidate, scores, totalScore, blockCodes, comparisons, rationale]
      properties:
        candidateId: { type: integer, minimum: 1, maximum: 10 }
        candidate:
          type: object
          required: [coreTopic, centralQuestion, title, angle, outline, evidencePlan, assertions, suggestedScores, rationale]
          properties:
            coreTopic: { type: string }
            centralQuestion: { type: string }
            title: { type: string, maxLength: 255 }
            angle: { type: string }
            outline:
              type: array
              minItems: 2
              maxItems: 5
              items: { type: string }
            evidencePlan:
              type: array
              items:
                type: object
                required: [sourceType, searchQuestion]
                properties:
                  sourceType: { type: string }
                  searchQuestion: { type: string }
            assertions:
              type: array
              items:
                type: object
                required: [assertion]
                properties:
                  assertion: { type: string }
                  evidenceId: { type: [string, 'null'] }
            suggestedScores: { $ref: '#/components/schemas/DiscoveryScores' }
            rationale: { type: string }
        scores: { $ref: '#/components/schemas/DiscoveryScores' }
        totalScore: { type: integer, minimum: 0, maximum: 100 }
        blockCodes:
          type: array
          items: { type: string, enum: [DUPLICATE, SIMILARITY_UNCERTAIN, CHANNEL_PROHIBITED, UNSUPPORTED_ASSERTION] }
        comparisons:
          type: array
          items:
            type: object
            required: [reason]
            properties:
              topicId: { type: [string, 'null'] }
              contentId: { type: [string, 'null'] }
              revisionId: { type: [string, 'null'] }
              reason: { type: string }
        rationale: { type: string }
    ProductionRequestSummary:
      type: object
      required: [id, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        status: { $ref: '#/components/schemas/ProductionStatus' }
    ProductionRequestDetail:
      type: object
      required: [id, channelId, contentType, status, limitKrw, reservedKrw, recognizedKrw, steps]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        channelId: { $ref: '#/components/schemas/Id' }
        contentType: { type: string, enum: [SHORTS, LONGFORM] }
        status: { $ref: '#/components/schemas/ProductionStatus' }
        contentId: { type: [string, 'null'] }
        runId: { type: [string, 'null'] }
        cancelRequestedAt: { type: [string, 'null'], format: date-time }
        limitKrw: { type: string, description: 제작 요청 상한 KRW }
        reservedKrw: { type: string, description: 남은 예약액 KRW }
        recognizedKrw: { type: string, description: 인식 비용 합계 KRW }
        steps:
          type: array
          items:
            type: object
            required: [stage, targetKey, inputGeneration, status, attempts]
            properties:
              stage:
                type: string
                enum: [DISCOVER, SELECT, RESEARCH, SCRIPT, SCENES, IMAGE, TTS, SUBTITLE, RENDER, METADATA, QC]
              targetKey: { type: string }
              inputGeneration: { type: integer, minimum: 1 }
              status:
                type: string
                enum: [PENDING, RUNNING, RETRY_WAIT, RECOVERY_REQUIRED, SUCCEEDED, FAILED, CANCELLED]
              attempts: { type: integer, minimum: 0, maximum: 3 }

    Id:
      type: string
      description: 양의 signed BIGINT 식별자 문자열 (1~9223372036854775807)
      pattern: '^[1-9][0-9]{0,18}$'
    KrwAmount:
      type: string
      description: KRW 금액, 소수 최대 6자리(부호 허용은 원장 delta에 한함)
      pattern: '^-?(0|[1-9][0-9]{0,17})(\.[0-9]{1,6})?$'
    NonNegativeKrwAmount:
      type: string
      pattern: '^(0|[1-9][0-9]{0,17})(\.[0-9]{1,6})?$'
    OriginalAmount:
      type: string
      description: 원본 통화 금액, 소수 최대 12자리
      pattern: '^-?(0|[1-9][0-9]{0,11})(\.[0-9]{1,12})?$'
    PositiveOriginalAmount:
      type: string
      pattern: '^(0|[1-9][0-9]{0,11})(\.[0-9]{1,12})?$'
    FxRate:
      type: string
      description: 1 base = rate KRW, 소수 최대 10자리, 0 초과
      pattern: '^(0|[1-9][0-9]{0,13})(\.[0-9]{1,10})?$'
    Currency:
      type: string
      pattern: '^[A-Z]{3}$'
    ForeignCurrency:
      type: string
      pattern: '^[A-Z]{3}$'
      not: { const: KRW }
    TimeZone:
      type: string
      description: IANA 시간대(예 Asia/Seoul). 서버에서 ZoneId로 검증
      minLength: 1
      maxLength: 64
    IdempotencyKey:
      type: string
      pattern: '^[A-Za-z0-9:._-]{8,128}$'
    Timestamp:
      type: string
      format: date-time

    ErrorCode:
      type: string
      enum: [INVALID_REQUEST, VALIDATION_FAILED, UNAUTHORIZED, FORBIDDEN, RESOURCE_NOT_FOUND, METHOD_NOT_ALLOWED,
             NOT_ACCEPTABLE, RESOURCE_CONFLICT, INVALID_STATE_TRANSITION, PREREQUISITE_NOT_MET, DUPLICATE_RESOURCE,
             PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE, POLICY_VIOLATION, BUDGET_EXCEEDED, RATE_LIMIT_EXCEEDED,
             CLIENT_ERROR, INTERNAL_SERVER_ERROR, SERVICE_UNAVAILABLE]
    ErrorDetail:
      type: object
      required: [field, reason]
      properties:
        field: { type: ['string', 'null'] }
        reason: { type: string }
    ErrorResponse:
      type: object
      required: [code, message, traceId, timestamp, details]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string }
        traceId: { type: string }
        timestamp: { $ref: '#/components/schemas/Timestamp' }
        details:
          type: array
          items: { $ref: '#/components/schemas/ErrorDetail' }

    PageMeta:
      type: object
      description: 페이지 메타 기준 스키마. 직접 참조하지 않고 *Page 스키마가 같은 필드를 평탄화해 포함한다(P-T02-01, OpenApiContractTest)
      required: [page, size, totalElements, totalPages]
      properties:
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalElements: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    VersionRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 0, description: optimistic lock 버전 }

    CsrfToken:
      type: object
      required: [headerName, token]
      properties:
        headerName: { type: string, const: X-XSRF-TOKEN }
        token: { type: string }
    LoginRequest:
      type: object
      required: [login, password]
      additionalProperties: false
      properties:
        login: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 1, maxLength: 256, format: password }
    CurrentUser:
      type: object
      required: [id, login, role]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        login: { type: string }
        role: { type: string, const: ADMIN }
        lastLoginAt: { type: ['string', 'null'], format: date-time }

    DashboardSummary:
      type: object
      description: SYSTEM 예산만 집계하며 CHANNEL 예산을 더하지 않는다(ADR-052)
      required: [channelCounts, systemUsage, reservationsRequiringReconciliation, spendingEnabled, consistency, generatedAt]
      properties:
        channelCounts:
          type: object
          required: [active, paused, archived]
          properties:
            active: { type: integer, minimum: 0 }
            paused: { type: integer, minimum: 0 }
            archived: { type: integer, minimum: 0 }
        systemUsage:
          type: array
          items: { $ref: '#/components/schemas/BudgetBucket' }
        reservationsRequiringReconciliation: { type: integer, minimum: 0 }
        spendingEnabled: { type: boolean }
        consistency: { $ref: '#/components/schemas/ConsistencyState' }
        generatedAt: { $ref: '#/components/schemas/Timestamp' }

    ChannelStatus:
      type: string
      enum: [ACTIVE, PAUSED, ARCHIVED]
    ContentType:
      type: string
      enum: [SHORTS, LONGFORM]
    Channel:
      type: object
      required: [id, name, language, timezone, status, version, currentConfigRevisionNo, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        language: { type: string }
        timezone: { $ref: '#/components/schemas/TimeZone' }
        status: { $ref: '#/components/schemas/ChannelStatus' }
        version: { type: integer, minimum: 0 }
        currentConfigRevisionNo: { type: integer, minimum: 1 }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        archivedAt: { type: ['string', 'null'], format: date-time }
    ChannelPage:
      type: object
      description: 평탄화된 최종 스키마(P-T02-01). 공통 필드는 PageMeta와 동일해야 한다(OpenApiContractTest)
      required: [page, size, totalElements, totalPages, items]
      properties:
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalElements: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
        items:
          type: array
          items: { $ref: '#/components/schemas/Channel' }
    ChannelCreateRequest:
      type: object
      required: [name, language, timezone]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        language: { type: string, pattern: '^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$' }
        timezone: { $ref: '#/components/schemas/TimeZone' }
        initialConfig: { $ref: '#/components/schemas/ChannelConfigSettings' }
    ChannelUpdateRequest:
      type: object
      required: [version]
      additionalProperties: false
      minProperties: 2
      properties:
        version: { type: integer, minimum: 0 }
        name: { type: string, minLength: 1, maxLength: 100 }
        language: { type: string, pattern: '^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$' }
        timezone: { $ref: '#/components/schemas/TimeZone' }
    ChannelConfigSettings:
      type: object
      description: 핵심 설정(정규화 컬럼)과 provider 옵션(JSON). defaultContentType은 제작 시 기본 선택값(ADR-039)
      required: [defaultContentType, shortsMinSeconds, shortsMaxSeconds, longformMinSeconds, longformMaxSeconds,
                 syntheticDisclosureDefault]
      additionalProperties: false
      properties:
        defaultContentType: { $ref: '#/components/schemas/ContentType' }
        shortsMinSeconds: { type: integer, minimum: 1, maximum: 180 }
        shortsMaxSeconds: { type: integer, minimum: 1, maximum: 180 }
        longformMinSeconds: { type: integer, minimum: 60, maximum: 14400 }
        longformMaxSeconds: { type: integer, minimum: 60, maximum: 14400 }
        contentStrategy: { type: ['string', 'null'], maxLength: 2000 }
        targetAudience: { type: ['string', 'null'], maxLength: 500 }
        narrationStyle: { type: ['string', 'null'], maxLength: 500 }
        visualStyle: { type: ['string', 'null'], maxLength: 500 }
        syntheticDisclosureDefault:
          type: boolean
          description: UI 초기 선택값일 뿐 영상별 합성 고지 판단을 대체하지 않는다(ADR-039)
        providerOptions:
          type: ['object', 'null']
          description: 비핵심 provider 옵션. 비밀값 금지
          additionalProperties: true
    ChannelConfig:
      type: object
      description: 평탄화된 최종 스키마(P-T02-01). 공통 필드는 ChannelConfigSettings와 동일해야 한다(OpenApiContractTest)
      required: [defaultContentType, shortsMinSeconds, shortsMaxSeconds, longformMinSeconds,
                 longformMaxSeconds, syntheticDisclosureDefault, channelId, revisionNo, createdBy, createdAt]
      properties:
        defaultContentType: { $ref: '#/components/schemas/ContentType' }
        shortsMinSeconds: { type: integer, minimum: 1, maximum: 180 }
        shortsMaxSeconds: { type: integer, minimum: 1, maximum: 180 }
        longformMinSeconds: { type: integer, minimum: 60, maximum: 14400 }
        longformMaxSeconds: { type: integer, minimum: 60, maximum: 14400 }
        contentStrategy: { type: ['string', 'null'], maxLength: 2000 }
        targetAudience: { type: ['string', 'null'], maxLength: 500 }
        narrationStyle: { type: ['string', 'null'], maxLength: 500 }
        visualStyle: { type: ['string', 'null'], maxLength: 500 }
        syntheticDisclosureDefault:
          type: boolean
          description: UI 초기 선택값일 뿐 영상별 합성 고지 판단을 대체하지 않는다(ADR-039)
        providerOptions:
          type: ['object', 'null']
          description: 비핵심 provider 옵션. 비밀값 금지
          additionalProperties: true
        channelId: { $ref: '#/components/schemas/Id' }
        revisionNo: { type: integer, minimum: 1 }
        changeNote: { type: ['string', 'null'], maxLength: 500 }
        createdBy: { $ref: '#/components/schemas/Id' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    ChannelConfigPage:
      type: object
