# CI (ADR-011). 실제 유료 API 호출/YouTube 업로드 없음. Docker 필요 테스트는 Linux job에서만 실행한다.
name: CI

on:
  push:
    branches: [main, v2/04-integration, v2/integration]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-linux:
    name: Backend (Linux, unit + integration)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Unit tests
        run: ./gradlew :backend:test
      - name: Integration tests (Testcontainers MariaDB)
        run: ./gradlew :backend:integrationTest
      - name: Build boot jar
        run: ./gradlew :backend:bootJar
      - name: Validate Docker Compose file
        env:
          AI_STUDIO_DB_USER: ci
          AI_STUDIO_DB_PASSWORD: ci-only-not-a-secret
        run: docker compose -f infra/docker-compose.yml config --quiet
      - name: Build backend image
        run: docker build -f infra/backend.Dockerfile -t ai-studio-backend:ci .
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: backend-linux-test-reports
          path: backend/build/reports/tests

  backend-windows:
    name: Backend (Windows, unit only)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Unit tests and boot jar (integration tests run on Linux only)
        # Windows 기본 shell(pwsh)에서는 POSIX 스크립트 gradlew 대신 gradlew.bat을 명시 실행한다
        shell: cmd
        run: gradlew.bat :backend:test :backend:bootJar

  frontend:
    name: Frontend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Keep UI waits stable when jsdom suites share the hosted runner.
      - run: npm test -- --maxWorkers=2
      - run: npm run build

  # 브라우저 E2E(Playwright, API는 브라우저 네트워크 계층 대역 — 백엔드·DB·유료 호출 없음).
  # Windows 러너에 설치된 Edge를 사용해 브라우저를 내려받지 않는다.
  frontend-e2e:
    name: Frontend E2E (Edge, windows-2025)
    runs-on: windows-2025
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run e2e
        env:
          PLAYWRIGHT_CHANNEL: msedge

  # OpenAPI 계약: Redocly lint + 생성 TS 타입 재생성 diff (ADR-033, ADR-040, ADR-041)
  openapi-contract:
    name: OpenAPI contract and generated types
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend/tools/openapi-typescript
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/tools/openapi-typescript/package-lock.json
      - run: npm ci
      - name: Lint OpenAPI (Redocly)
        run: npm run lint:openapi
      - name: Generated types match docs/api/openapi.yaml
        run: npm run check

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLO "${base}/${file}"
          curl -sSL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${file}\$" | sha256sum -c -
          tar -xzf "${file}" gitleaks
      - name: Scan git history
        run: ./gitleaks git --redact --verbose .
